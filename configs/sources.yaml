# Data provider registry (T002 — docs/DATA_SOURCES.md is the prose design).
# Machine-readable contract consumed by collectors (T004).
#
# Selection rule: for each (domain, datatype) pick the highest-priority `enabled`
# provider; on validation failure or data-quality gate (§39) fall back to the next.
# For market EOD the worker enforces this chain at runtime
# (`src/data/providers/registry.py::market_provider_chain` — primary first, then
# `fallback_chains.market`), so one vendor outage does not leave the universe
# un-scored. Secrets are NEVER here — providers reference env var NAMES via
# credential_env (spec §32, docs/SECURITY_vi.md §2).

version: t002_baseline

defaults:
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 5

providers:
  # --- Market + fundamental (primary) -------------------------------------
  - id: ssix_finipro
    description: SSI FastConnect / FiniPro — registered per-user access
    roles: [market, fundamental, corporate_events, news]
    auth: bearer
    # Either credential path works: SSI_CONSUMER_ID + SSI_CONSUMER_SECRET are
    # exchanged for a JWT (Market/AccessToken), or a ready-made token is provided
    # via FINIPRO_ACCESS_TOKEN. Names only — values live in .env (never here).
    credential_env: FINIPRO_ACCESS_TOKEN
    free: true
    licensed: true
    enabled: true
    priority: 100
    # 2026-09-27: VERIFIED end to end from the project host with live consumer
    # credentials — Market/DailyOhlc returned 68 bars for FPT,VCB,HPG,ACB
    # (2026-09-01..26, quality 93.74, written=68) and Market/DailyIndex returned
    # 34 bars for VNINDEX,VN30 (written=34). Token caching + 401 refresh tested in
    # tests/unit/test_ssi_provider.py.
    endpoints_status: VERIFIED_2026-09-27
    endpoints:
      eod:
        client: ssi_fastconnect
        url: https://fc-data.ssi.com.vn

  # --- Market + fundamental fallbacks (anonymous/unofficial) --------------
  # Yahoo is the only market fallback VERIFIED reachable from the project host
  # (2026-09-25): v8 chart answers 200 for .VN tickers with a descriptive
  # User-Agent (default python-httpx UA → 429). Priority 85 puts it first in
  # the market fallback chain ahead of the currently unreachable candidates.
  - id: yahoo
    description: Yahoo Finance chart API — Vietnam listings via .VN suffix (unofficial)
    roles: [market, corporate_events]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 85
    # 2026-09-25: VERIFIED from the project host for FPT/VCB/HPG/ACB/BSR(.VN)
    # across HOSE/HNX/UPCOM. Recorded sample: tests/fixtures/yahoo_chart_sample.json.
    # Caveats (encoded in YahooChartProvider + tested):
    #   * quote OHLCV is split-adjusted (FPT 11:10 on 2026-09-21) → provider
    #     un-adjusts via events=split to store raw prints;
    #   * no turnover field → trading_value = close × volume (approximation);
    #   * null/zero-volume placeholder rows are dropped, not fabricated;
    #   * meta.fullExchangeName reports HOSE for every listing → exchange comes
    #     from config (informational only; prices key on stock_id).
    endpoints_status: VERIFIED_2026-09-25
    endpoints:
      eod:
        client: yahoo_chart
        url: "https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
        symbol_suffix: ".VN"
        interval: "1d"
        timezone_offset_hours: 7   # Asia/Ho_Chi_Minh (no DST)
        exchange: HOSE             # default label; see caveat above
        user_agent: "DTCK/0.1 (+https://github.com/dvtung/DTCK)"

  - id: vndirect
    description: VNDirect fininfo public API (unofficial)
    roles: [market, fundamental]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 80
    # 2026-09-25: NOT reachable from the project host — DNS resolves
    # finfo-api.vndirect.com.vn to a private RFC1918 address (10.210.100.8) and
    # connections time out. Kept enabled in config; the collector must skip it
    # until the network/DNS path is fixed (see docs/DATA_SOURCES.md §8).
    endpoints_status: UNREACHABLE_FROM_HOST_2026-09-25
    # Candidate EOD endpoint — MUST be snapshot-tested before live use.
    # Field names below are the expected mapping, not yet confirmed (KI-006).
    endpoints:
      eod:
        url: "https://finfo-api.vndirect.com.vn/v4/stocks/daily_prices"
        params:
          q: "code:{symbol}~date:{start}~{end}"
          size: "100"
          page: "1"
        list_path: "data"
        date_format: "%Y-%m-%d"
        exchange: HOSE
        fields:
          symbol: code
          trade_date: tradingDate
          open: openPrice
          high: highPrice
          low: lowPrice
          close: closePrice
          volume: nmVolume
          trading_value: nmValue

  # --- Fundamental data (financial statements + corporate events, GĐ 2) ----
  - id: cafef_financials
    description: CafeF apiweb — quarterly/annual financial statements (real BCTC)
    roles: [fundamental]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 90
    # 2026-10-03: VERIFIED reachable from the dev host — all three endpoints
    # answered 200 with real FPT data (payload snapshot:
    # tests/fixtures/cafef_financials_sample.json). SSI's FastConnect Data API
    # has NO financial endpoints (official function list), VNDirect times out
    # from this host, so this is the primary source for the fundamental role.
    # Caveat: CafeF returns NO filing timestamp → published_at stays NULL.
    endpoints_status: VERIFIED_2026-10-03
    endpoints:
      fundamental:
        client: cafef_financial
        origin: "https://apiweb.cafef.vn"
        statements:
          BALANCE: { path: "api/v2/BCTC/GetReportCDKT", report_type: "ALL" }
          INCOME: { path: "api/v1/BCTC/GetReportDetail", report_type: "KQKD" }
          CASHFLOW: { path: "api/v1/BCTC/GetReportLCTT", report_type: "ALL" }

  - id: vndirect_financials
    description: VNDirect finfo — quarterly financial statements + corporate events
    roles: [fundamental, corporate_events]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 80
    # SSI's FastConnect *Data* API has NO financial endpoints (verified
    # 2026-10-03 against the official function list: AccessToken, Securities,
    # SecuritiesDetails, DailyOhlc, DailyIndex, IndexList, IndexComponents,
    # IntradayOhlc, DailyStockPrice). SSI's statements live in the separate
    # iExcel product, which has no REST API — so the fundamental role is served
    # here. Reachability from the dev host is still UNVERIFIED (same DNS/timeout
    # caveat as `vndirect`), hence the defensive mapping in
    # src/data/providers/vndirect_financials.py: unknown keys are skipped and a
    # missing publication date is stored NULL — never fabricated (KI-006).
    endpoints_status: MAPPING_TO_VERIFY_2026-10-03
    endpoints:
      fundamental:
        client: vndirect_finfo
        url: "https://finfo-api.vndirect.com.vn/v4"

  - id: tcbs
    description: TCBS public API (unofficial)
    roles: [market, fundamental]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 70
    # 2026-09-25: requests are answered with a Cloudflare JS challenge
    # ("Just a moment…"), so headless collection is not possible.
    endpoints_status: BLOCKED_BY_CLOUDFLARE_2026-09-25

  - id: dsc
    description: DSC GraphData public GraphQL (unofficial)
    roles: [market, fundamental]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 60
    endpoints_status: TO_VERIFY

  # --- Official exchanges (licensing required — disabled for now) ---------
  - id: hose
    description: HOSE official listed-company data
    roles: [market, corporate_events]
    auth: none
    credential_env: ""
    free: false
    licensed: true
    enabled: false
    priority: 50

  - id: hnx
    description: HNX official listed-company data
    roles: [market, corporate_events]
    auth: none
    credential_env: ""
    free: false
    licensed: true
    enabled: false
    priority: 50

  # --- Fundamental (optional paid) -----------------------------------------
  - id: vietstock
    description: Vietstock VIP financial data (paid)
    roles: [fundamental]
    auth: bearer
    credential_env: VIETSTOCK_API_KEY
    free: false
    licensed: true
    enabled: false
    priority: 40

  # --- Macro (official public) ----------------------------------------------
  - id: sbv
    description: State Bank of Vietnam — rates, credit growth, M2, FX reference
    roles: [macro]
    auth: none
    credential_env: ""
    free: true
    licensed: true
    enabled: true
    priority: 90
    endpoints_status: TO_VERIFY

  - id: gso
    description: General Statistics Office — GDP, CPI, industrial production
    roles: [macro]
    auth: none
    credential_env: ""
    free: true
    licensed: true
    enabled: true
    priority: 90
    endpoints_status: TO_VERIFY

  - id: imf_worldbank
    description: IMF/World Bank public APIs — benchmarks, inflation, FX history
    roles: [macro]
    auth: none
    credential_env: ""
    free: true
    licensed: true
    enabled: true
    priority: 80
    # 2026-10-03: IMF datamapper VERIFIED reachable from the dev host
    # (`/external/datamapper/api/v1/{indicator}/VNM` → 200, real series).
    # World Bank / GSO / SBV APIs are NOT reachable here (timeout / no DNS /
    # HTML-only), so only the IMF half of this entry is wired.
    endpoints_status: VERIFIED_2026-10-03
    endpoints:
      macro:
        client: imf_datamapper
        origin: "https://www.imf.org/external/datamapper/api/v1"
        country: VNM
        # Only completed years are stored — IMF WEO values for later years are
        # projections and must never be persisted as observations (§31).
        max_year_offset: 1
        indicators:
          GDP_GROWTH_PCT: { code: NGDP_RPCH, unit: percent }
          CPI_INFLATION_PCT: { code: PCPIPCH, unit: percent }
  - id: tradingeconomics
    description: TradingEconomics aggregation (paid)
    roles: [macro]
    auth: query
    credential_env: TRADINGECONOMICS_API_KEY
    free: false
    licensed: true
    enabled: false
    priority: 50

  # --- News (Vietnamese) ------------------------------------------------------
  - id: cafef
    description: CafeF financial news (RSS/HTML)
    roles: [news]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 90
    # 2026-09-25: VERIFIED — the market feed answers 302 → 200 with redirect
    # following + a descriptive User-Agent and returns valid RSS 2.0
    # (recorded sample: tests/fixtures/cafef_rss_sample.xml).
    endpoints_status: VERIFIED_2026-09-25
    endpoints:
      news:
        url: "https://cafef.vn/thi-truong-chung-khoan.rss"
        user_agent: "DTCK/0.1 (+https://github.com/dvtung/DTCK)"

  - id: vnexpress
    description: VnExpress finance news (RSS)
    roles: [news]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 80

  - id: vietstock_news
    description: Vietstock market news (RSS)
    roles: [news]
    auth: none
    credential_env: ""
    free: true
    licensed: false
    enabled: true
    priority: 70

  - id: newsdata
    description: NewsData.io symbol-tagged news (paid, optional)
    roles: [news]
    auth: query
    credential_env: NEWS_API_KEY
    free: false
    licensed: true
    enabled: false
    priority: 50

# Which provider wins per domain (informational mirror of the priority rules;
# collectors compute this from `providers` so the two must stay consistent).
selection:
  market: ssix_finipro
  fundamental: cafef_financials
  valuation: computed          # Quant Engine computes; no external source of truth
  macro: imf_worldbank
  corporate_events: yahoo
  news: cafef

fallback_chains:
  market: [yahoo, vndirect, tcbs, dsc]
  fundamental: [vndirect_financials]
  macro: [gso, tradingeconomics]
  corporate_events: [vndirect_financials, hose, cafef]
  news: [vnexpress, vietstock_news, newsdata]