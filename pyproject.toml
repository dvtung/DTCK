[project]
name = "dtck-ai-investment-platform"
version = "0.1.0"
description = "AI Investment Research & Decision Intelligence Platform (Vietnam Stock Market: HOSE/HNX/UPCOM)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "DTCK" }]
dependencies = [
    # --- Core ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",

    # --- Data & numerics ---
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "polars>=1.2,<1.7",

    # --- Dashboard ---
    "streamlit>=1.36,<2.0",
    "plotly>=5.22,<8.0",

    # --- Scheduler ---
    "apscheduler>=3.10,<4.0",

    # --- HTTP client ---
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
]
rag = [
    "qdrant-client>=1.9,<2.0",
    "sentence-transformers>=2.7,<4.0",
]
agents = [
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.2,<1.0",
    "langchain-openai>=0.2,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
]

[project.scripts]
dtck-api = "apps.api.main:run"
dtck-worker = "apps.worker.main:run"

[tool.setuptools.packages.find]
include = ["apps*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src", "apps"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_unimported = false
disallow_any_decorated = false
disallow_any_explicit = false
check_untyped_defs = true
disable_error_code = ["arg-type", "no-untyped-call", "type-var", "operator", "truthy-bool"]

[[tool.mypy.overrides]]
module = "apps.dashboard.app"
# Streamlit entrypoint: third-party UI libs (pandas/plotly/streamlit)
# ship without mypy stubs; runtime behavior is covered by unit tests.
ignore_missing_imports = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "apps.api.routers.*"
disallow_untyped_defs = false
disallow_any_decorated = false
# Router handlers return JSON payload dicts validated by FastAPI ``response_model``;
# explicit Any is the honest annotation for that boundary.
disallow_any_explicit = false

[[tool.mypy.overrides]]
# Third-party libraries that ship no py.typed marker / stubs.
module = ["apscheduler.*", "streamlit", "streamlit.*", "uvicorn", "pandas.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"